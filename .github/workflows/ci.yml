name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          # Node 版本统一读取 .nvmrc(当前 24),满足 pnpm@11.5.0 与 pi@0.84 的 engines 要求
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Format check
        # apps/api 下有 28 个文件存在历史 prettier 格式债,尚未清理。
        # 暂设为非阻塞:prettier 仍会在日志中列出不合规文件作为软提醒,但不阻断 CI。
        # 待执行 pnpm run format:fix 清理后,删掉本行 continue-on-error 即可恢复严格门禁。
        continue-on-error: true
        run: pnpm run format:check

      # @fateclaw/contracts 现为标准 tsc 构建包(产物不进仓),
      # 下游 typecheck/test 经 package.json exports 解析到 dist,故需先构建。
      - name: Build contracts
        run: pnpm run build:contracts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test
