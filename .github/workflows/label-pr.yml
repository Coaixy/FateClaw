name: Label PR

on:
  pull_request:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const labels = [];

            if (body.includes('[x] **Feature**'))             labels.push('PR: Feature');
            if (body.includes('[x] **Official Skill**'))      labels.push('PR: Skill');
            if (body.includes('[x] **User knowledge / Skill runtime**')) labels.push('PR: Skill');
            if (body.includes('[x] **OpenClaw/iLink integration**')) labels.push('PR: Integration');
            if (body.includes('[x] **Fix**'))                 labels.push('PR: Fix');
            if (body.includes('[x] **Simplification**'))      labels.push('PR: Refactor');
            if (body.includes('[x] **Documentation**'))       labels.push('PR: Docs');

            if (body.includes('contributing-guide: v2')) labels.push('follows-guidelines');

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels,
              });
            }
