packages:
  - 'apps/*'
  - 'packages/*'

trustLockfile: true

overrides:
  fast-jwt: '>=6.2.4'
  fast-uri: '>=3.1.2'
  postcss: '>=8.5.10'
  vite: '>=8.0.5'
  picomatch: '>=4.0.4'
  brace-expansion@^1.0.0: 1.1.13
  brace-expansion@^5.0.0: 5.0.6

packageExtensions:
  '@alicloud/openapi-core@1.0.7':
    dependencies:
      '@alicloud/tea-typescript': '^1.8.0'

allowBuilds:
  '@alicloud/openapi-core': true
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - iching-shifa@1.6.3
  - bazi-ts-lib@1.0.2
  - iching-shifa@1.6.4
  - meihua-ts-lib@0.1.0
  - kinqimen@0.3.1
  - iching-shifa@1.6.5
  - iching-shifa@1.7.0
  - iching-shifa@1.7.1
  - iching-shifa@1.8.0
  - '@earendil-works/chord@0.86.0'
  - '@earendil-works/pi-agent-core@0.86.0'
  - '@earendil-works/pi-ai@0.86.0'
  - '@earendil-works/pi-coding-agent@0.86.0'
  - '@earendil-works/pi-telemetry@0.86.0'
  - '@earendil-works/pi-tui@0.86.0'
