packages:
  - 'apps/*'
  - 'packages/*'

trustLockfile: true

overrides:
  '@humanfs/node@^0.16.0': '^0.16.8'
  fast-copy@^4.0.0: '^4.1.0'
  fast-jwt: '^6.3.5'
  fast-uri@^3.0.0: '^3.1.8'
  js-yaml@^4.0.0: '^4.3.2'
  moment: '^2.31.0'
  postcss: '^8.5.30'
  shell-quote: '^1.12.0'
  source-map-js: '^1.2.2'
  vite: '^8.3.4'
  picomatch: '^4.0.4'
  brace-expansion@^1.0.0: '^1.1.21'
  brace-expansion@^5.0.0: '^5.0.12'

# No upstream release fixes GHSA-vfj7-8cjw-p6xm yet.
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch

packageExtensions:
  '@alicloud/openapi-core@1.0.7':
    dependencies:
      '@alicloud/tea-typescript': '^1.8.0'

allowBuilds:
  '@alicloud/openapi-core': true
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - iching-shifa@1.6.3
  - bazi-ts-lib@1.0.2
  - iching-shifa@1.6.4
  - meihua-ts-lib@0.1.0
  - kinqimen@0.4.0
  - iching-shifa@1.6.5
  - iching-shifa@1.7.0
  - iching-shifa@1.7.1
  - iching-shifa@1.8.0
