packages:
  - 'apps/*'
  - 'packages/*'

trustLockfile: true

overrides:
  fast-jwt: ">=6.2.2"
  vite: ">=8.0.5"
  picomatch: ">=4.0.4"
  brace-expansion@^1.0.0: 1.1.13
  brace-expansion@^5.0.0: 5.0.5

packageExtensions:
  "@alicloud/openapi-core@1.0.7":
    dependencies:
      "@alicloud/tea-typescript": "^1.8.0"

allowBuilds:
  '@alicloud/openapi-core': true
  '@google/genai': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - iching-shifa@1.6.3
